name: Agent Build Test

on:
  push:
    branches:
      - ai-agent-mvp
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-build-test:
    name: Agent Engine Build/Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Detect project
        id: detect
        shell: bash
        run: |
          if [[ -x ./gradlew || -f build.gradle || -f build.gradle.kts ]]; then
            echo "type=gradle" >> "$GITHUB_OUTPUT"
          elif [[ -f package.json ]]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [[ -f pyproject.toml || -f requirements.txt || -f pytest.ini || -f tox.ini ]]; then
            echo "type=python" >> "$GITHUB_OUTPUT"
          elif [[ -f Cargo.toml ]]; then
            echo "type=rust" >> "$GITHUB_OUTPUT"
          elif [[ -f go.mod ]]; then
            echo "type=go" >> "$GITHUB_OUTPUT"
          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

          echo "Detected project type:"
          cat "$GITHUB_OUTPUT"

      - name: Validate Agent Engine
        if: steps.detect.outputs.type == 'python'
        shell: bash
        run: |
          set -e

          echo "=== Python syntax check ==="
          python -m py_compile agent/loop.py agent/tools.py cli.py

          echo "=== Agent tool registry check ==="
          python - <<'PY2'
          from agent.tools import TOOLS

          required = [
              "github_repo_info",
              "github_workflows",
              "github_workflow_runs",
              "github_workflow_run",
              "github_workflow_status",
              "github_workflow_wait",
              "git_create_branch",
              "git_commit",
              "git_push",
              "github_pr_create",
              "run_test",
              "detect_project",
          ]

          missing = [name for name in required if name not in TOOLS]

          if missing:
              raise SystemExit(
                  "Missing required tools: " + ", ".join(missing)
              )

          print("PASS: all required Agent Engine tools registered")
          print("TOOLS:", len(TOOLS))
          PY2

          echo "=== Git diff check ==="
          git diff --check

          echo "=== Agent Build/Test: PASS ==="

      - name: Gradle project validation
        if: steps.detect.outputs.type == 'gradle'
        shell: bash
        run: |
          set -e
          echo "Gradle project detected."
          if [[ -x ./gradlew ]]; then
            ./gradlew test
          else
            echo "ERROR: Gradle project detected but ./gradlew is missing."
            exit 1
          fi

      - name: Node project validation
        if: steps.detect.outputs.type == 'node'
        shell: bash
        run: |
          set -e
          npm ci
          npm test

      - name: Rust project validation
        if: steps.detect.outputs.type == 'rust'
        shell: bash
        run: |
          set -e
          cargo test

      - name: Go project validation
        if: steps.detect.outputs.type == 'go'
        shell: bash
        run: |
          set -e
          go test ./...

      - name: Unsupported project
        if: steps.detect.outputs.type == 'unknown'
        shell: bash
        run: |
          echo "ERROR: unsupported project type"
          exit 1
